name: Weight Notification (Manual Fallback)

# Scheduling is handled by Supabase pg_cron (see migration 008_notification_cron.sql).
# This workflow is a manual-only fallback for re-triggering missed runs.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Notification mode (daily or weekly)'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - weekly

jobs:
  send-notifications:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke weight notification edge function
        run: |
          http_code=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/send-weight-notifications?mode=${{ inputs.mode }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}')

          body=$(cat /tmp/response.json)
          echo "Response ($http_code): $body"

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Edge function returned HTTP $http_code"
            exit 1
          fi
